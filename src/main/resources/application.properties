# ============================================
# LLM Wiki — Karpathy Pattern (File-Based)
# ============================================

# --- Primary Chat Model ---
quarkus.langchain4j.chat-model.provider=${LLM_PROVIDER:openai}

quarkus.langchain4j.openai.base-url=${LLM_CHAT_BASE_URL:https://api.openai.com/v1}
quarkus.langchain4j.openai.api-key=${LLM_CHAT_API_KEY:change-me}
quarkus.langchain4j.openai.chat-model.model-name=${LLM_CHAT_MODEL:gpt-4o}
quarkus.langchain4j.openai.timeout=120s

# --- Fallback Chat Model (used when primary fails) ---
quarkus.langchain4j.openai.fallback.base-url=${LLM_FALLBACK_BASE_URL:https://openrouter.ai/api/v1}
quarkus.langchain4j.openai.fallback.api-key=${LLM_FALLBACK_API_KEY:${LLM_CHAT_API_KEY:change-me}}
quarkus.langchain4j.openai.fallback.chat-model.model-name=${LLM_FALLBACK_MODEL:anthropic/claude-sonnet-4-20250514}
quarkus.langchain4j.openai.fallback.timeout=180s

# --- Retry Settings (read via env vars in RetryableChatService) ---
# LLMWIKI_RETRY_MAX_ATTEMPTS=3
# LLMWIKI_RETRY_DELAY_SECONDS=30

# --- Wiki Verzeichnisse ---
# Dev Mode: IMMER im Projektverzeichnis (./wiki-data)
# Produktiv: IMMER relativ zum Jar-Startverzeichnis (./scrwiki-data)
# Umgebungsvariablen (LLMWIKI_*) überschreiben beide.
llmwiki.base-dir=./wiki-data
llmwiki.raw-dir=./wiki-data/raw
llmwiki.wiki-dir=./wiki-data/wiki
llmwiki.projects-dir=./wiki-data/projects

# --- Prod Mode (wenn nicht dev) ---
%prod.llmwiki.base-dir=./scrwiki-data
%prod.llmwiki.raw-dir=./scrwiki-data/raw
%prod.llmwiki.wiki-dir=./scrwiki-data/wiki
%prod.llmwiki.projects-dir=./scrwiki-data/projects

# --- Server ---
quarkus.http.port=${QUARKUS_HTTP_PORT:8480}

# ============================================
# MCP Server (read via env var PROVIDE_MCP_ENDPOINT)
# ============================================

# --- Logging ---
quarkus.log.category."com.example.llmwiki".level=DEBUG
quarkus.log.category."dev.langchain4j".level=DEBUG
quarkus.log.console.level=DEBUG
quarkus.log.console.format=%d{HH:mm:ss,SSS} %-5p [%c{2.}] (%t) %s%e%n

# Log-Datei
quarkus.log.file.path=${LLMWIKI_LOG_FILE:llmwiki.log}
quarkus.log.file.level=DEBUG
quarkus.log.file.format=%d{yyyy-MM-dd HH:mm:ss,SSS} %-5p [%c{2.}] (%t) %s%e%n
quarkus.log.file.rotation.max-file-size=10M
quarkus.log.file.rotation.max-backup-index=5

# LLM Request/Response Logging (nur Dev Mode)
%dev.quarkus.langchain4j.openai.log-requests=true
%dev.quarkus.langchain4j.openai.log-responses=true
