# ============================================
# LLM Wiki — Karpathy Pattern (File-Based)
# ============================================

# --- Chat Model ---
quarkus.langchain4j.chat-model.provider=${LLM_PROVIDER:openai}

quarkus.langchain4j.openai.base-url=${LLM_CHAT_BASE_URL:https://api.openai.com/v1}
quarkus.langchain4j.openai.api-key=${LLM_CHAT_API_KEY:change-me}
quarkus.langchain4j.openai.chat-model.model-name=${LLM_CHAT_MODEL:gpt-4o}
quarkus.langchain4j.openai.timeout=120s

# --- Wiki Verzeichnisse ---
llmwiki.base-dir=${LLMWIKI_BASE_DIR:${HOME}/karpathy-wiki}
llmwiki.raw-dir=${LLMWIKI_RAW_DIR:${HOME}/karpathy-wiki/raw}
llmwiki.wiki-dir=${LLMWIKI_WIKI_DIR:${HOME}/karpathy-wiki/wiki}

# --- Server ---
quarkus.http.port=${QUARKUS_HTTP_PORT:8480}

# --- Logging ---
quarkus.log.category."com.example.llmwiki".level=DEBUG
quarkus.log.category."dev.langchain4j".level=DEBUG
quarkus.log.console.level=DEBUG
quarkus.log.console.format=%d{HH:mm:ss,SSS} %-5p [%c{2.}] (%t) %s%e%n

# Log-Datei
quarkus.log.file.path=${LLMWIKI_LOG_FILE:llmwiki.log}
quarkus.log.file.level=DEBUG
quarkus.log.file.format=%d{yyyy-MM-dd HH:mm:ss,SSS} %-5p [%c{2.}] (%t) %s%e%n
quarkus.log.file.rotation.max-file-size=10M
quarkus.log.file.rotation.max-backup-index=5

# LLM Request/Response Logging (nur Dev Mode)
%dev.quarkus.langchain4j.openai.log-requests=true
%dev.quarkus.langchain4j.openai.log-responses=true
